name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest

  home-assistant-smoke:
    name: Home Assistant ${{ matrix.name }} smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            requirement: homeassistant==2026.3.0
          - name: latest
            requirement: homeassistant>=2026.3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install project and Home Assistant
        run: |
          python -m pip install --upgrade pip
          pip install -e . "${{ matrix.requirement }}"
      - name: Home Assistant API and schema smoke
        run: |
          python - <<'PY'
          import inspect

          from homeassistant import config_entries
          from homeassistant.components import webhook
          from homeassistant.helpers import config_validation as cv

          # HA 2026.9+ replaced voluptuous with probatio and dropped
          # voluptuous-serialize; use the serializer HA itself uses for flows.
          try:
              from probatio import to_field_list as convert
          except ImportError:
              from voluptuous_serialize import convert

          import custom_components.unifi_protect_bridge as integration
          from custom_components.unifi_protect_bridge.config_flow import (
              _build_full_schema,
          )

          register_params = inspect.signature(webhook.async_register).parameters
          serialized = convert(
              _build_full_schema({}, require_password=True),
              custom_serializer=cv.custom_serializer,
          )

          assert hasattr(config_entries, "OptionsFlowWithReload")
          assert hasattr(config_entries.ConfigFlow, "async_update_reload_and_abort")
          assert "allowed_methods" in register_params
          assert "local_only" in register_params
          assert integration.CONFIG_SCHEMA is not None
          assert {field["name"] for field in serialized} == {
              "host",
              "username",
              "password",
              "verify_ssl",
              "webhook_base_url",
          }
          PY
